<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dmitrii Lutsenko — Playable Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --fg:#0d0d0d; --muted:#8e8e93; --soft:#b4b4b8; --line:#ebebeb; --bg:#fff; --ease:cubic-bezier(.2,.7,.2,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--fg); }
  body { font:15px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; font-feature-settings:"ss01","cv11"; }
  ::selection { background:#0d0d0d; color:#fff; }
  main { max-width:1120px; margin:0 auto; padding:96px 32px 96px; }
  header { margin-bottom:88px; }
  h1 { font-size:clamp(34px,5vw,52px); font-weight:600; letter-spacing:-.035em; line-height:1.05; }
  header p { color:var(--muted); margin-top:12px; font-size:16px; letter-spacing:-.005em; }
  header a { color:var(--muted); text-decoration:none; background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat; transition:color .3s, background-size .4s var(--ease); }
  header a:hover { color:var(--fg); background-size:100% 1px; }
  .tools { display:flex; gap:6px; margin-top:20px; }
  .tools span { height:26px; padding:0 9px; border-radius:999px; background:#f5f5f6; display:inline-flex; align-items:center; font-size:11.5px; font-weight:500; color:var(--muted); letter-spacing:.01em; cursor:default; transition:color .25s, background .25s; }
  .tools span:hover { color:var(--fg); background:#ededee; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:56px 32px; }
  .card { display:block; cursor:pointer; background:none; border:0; text-align:left; font:inherit; color:inherit; opacity:0; transform:translateY(14px); animation:rise .8s var(--ease) forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  .thumb { position:relative; aspect-ratio:9/16; background:#f4f4f5; border-radius:22px; overflow:hidden; display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 16px -4px rgba(0,0,0,.08), 0 24px 48px -16px rgba(0,0,0,.14);
    transition:transform .6s var(--ease), box-shadow .6s var(--ease); }
  .thumb::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); pointer-events:none; }
  .card.land .thumb { aspect-ratio:16/9; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform 1s var(--ease); }
  .thumb > span { color:var(--soft); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  .play { position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(12px) saturate(1.6); backdrop-filter:blur(12px) saturate(1.6); box-shadow:0 8px 24px rgba(0,0,0,.18); opacity:0; transform:scale(.85); transition:opacity .4s var(--ease), transform .5s var(--ease); }
  .play::before { content:""; position:absolute; left:24px; top:20px; border-left:15px solid #0d0d0d; border-top:10px solid transparent; border-bottom:10px solid transparent; }
  .card:hover .thumb, .card:focus-visible .thumb { transform:translateY(-6px);
    box-shadow:0 2px 4px rgba(0,0,0,.04), 0 12px 24px -6px rgba(0,0,0,.10), 0 40px 72px -20px rgba(0,0,0,.22); }
  .card:hover .thumb img { transform:scale(1.04); }
  .card:hover .play, .card:focus-visible .play { opacity:1; transform:none; }
  .card:focus-visible { outline:none; }
  .title { margin-top:20px; font-weight:500; font-size:16px; letter-spacing:-.01em; }
  .tags { color:var(--muted); font-size:13px; margin-top:2px; }
  .lock { max-width:360px; animation:rise .8s var(--ease) both; }
  .lock[hidden] { display:none; }
  .lock p { color:var(--muted); font-size:15px; }
  .lock form { margin-top:20px; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 18px; border-radius:999px; background:#f5f5f6; transition:background .25s, box-shadow .25s; }
  .lock form:focus-within { background:#fff; box-shadow:0 0 0 1px var(--line), 0 10px 30px -10px rgba(0,0,0,.15); }
  .lock input { flex:1; min-width:0; border:0; background:transparent; font:inherit; font-size:16px; color:var(--fg); outline:none; height:36px; -webkit-user-select:text; user-select:text; }
  .lock button { width:36px; height:36px; border-radius:50%; border:0; background:var(--fg); color:#fff; font-size:16px; cursor:pointer; transition:transform .2s var(--ease), opacity .2s; }
  .lock button:hover { transform:translateX(2px); }
  .lock form.busy button { opacity:.4; pointer-events:none; }
  .lock .err { color:#d33; font-size:13px; height:20px; margin-top:8px; padding-left:18px; }
  .lock .ask { font-size:13px; color:var(--soft); margin-top:8px; }
  .lock .ask a { color:var(--muted); }
  .modal.loading .frame::after { content:""; position:absolute; left:50%; top:50%; width:28px; height:28px; margin:-14px; border-radius:50%; border:2px solid #ddd; border-top-color:var(--fg); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  footer { margin-top:120px; padding-top:24px; border-top:1px solid var(--line); color:var(--soft); font-size:13px; display:flex; justify-content:space-between; }
  footer a { color:var(--soft); text-decoration:none; transition:color .25s; }
  footer a:hover { color:var(--fg); }

  .modal { position:fixed; inset:0; background:rgba(255,255,255,.86); -webkit-backdrop-filter:blur(24px) saturate(1.4); backdrop-filter:blur(24px) saturate(1.4); display:flex; visibility:hidden; opacity:0; align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:48px 16px 16px; z-index:10; transition:opacity .35s var(--ease), visibility 0s .35s; }
  .modal:not(.open) { pointer-events:none; }
  body.viewing main { visibility:hidden; }
  body.viewing { background:#fff; }
  .modal.open { visibility:visible; opacity:1; transition:opacity .35s var(--ease); }
  .shell { border-radius:26px; box-shadow:0 2px 6px rgba(0,0,0,.05), 0 30px 80px -20px rgba(0,0,0,.28); transform:scale(.97) translateY(8px); transition:transform .5s var(--ease); }
  .modal.open .shell { transform:none; }
  .frame { position:relative; border-radius:26px; overflow:hidden; background:#f4f4f5; isolation:isolate; -webkit-mask-image:-webkit-radial-gradient(white, black); transform:translateZ(0); }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .bar { display:flex; gap:6px; font-size:13px; }
  .bar button { background:transparent; border:0; border-radius:999px; padding:7px 14px; font:inherit; color:var(--muted); cursor:pointer; transition:color .2s, background .2s; }
  .bar button:hover { color:var(--fg); background:rgba(0,0,0,.05); }
  .back { position:absolute; top:16px; left:16px; background:transparent; border:0; border-radius:999px; padding:7px 14px; font:inherit; font-size:14px; color:var(--muted); cursor:pointer; transition:color .2s, background .2s; }
  .back:hover { color:var(--fg); background:rgba(0,0,0,.05); }
  .close { position:absolute; top:12px; right:14px; width:40px; height:40px; border-radius:50%; font-size:24px; line-height:1; background:transparent; border:0; color:var(--fg); cursor:pointer; transition:background .2s; }
  .close:hover { background:rgba(0,0,0,.05); }
  @media (max-width:520px) { main { padding:56px 20px 64px; } header { margin-bottom:48px; } .grid { grid-template-columns:1fr 1fr; gap:32px 14px; } .thumb { border-radius:16px; } .title { margin-top:12px; font-size:14px; } .play { display:none; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } .card { opacity:1; transform:none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Dmitrii Lutsenko</h1>
    <p>Playable Ads · <a href="https://t.me/dmtraw" target="_blank" rel="noopener">tg: @dmtraw</a></p>
    <div class="tools" aria-label="Инструменты">
      <span title="Cinema 4D">C4D</span>
      <span title="Cocos Creator">Cocos</span>
      <span title="Adobe After Effects">Ae</span>
      <span title="Adobe Photoshop">Ps</span>
    </div>
  </header>
  <section class="lock" id="lock" hidden>
    <p>Работы под NDA. Введите пароль, чтобы посмотреть.</p>
    <form id="lockform">
      <input id="pass" type="password" placeholder="Пароль" aria-label="Пароль" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" aria-label="Открыть">→</button>
    </form>
    <div class="err" id="err"></div>
    <p class="ask">Нет пароля? Напишите в <a href="https://t.me/dmtraw" target="_blank" rel="noopener">Telegram</a></p>
  </section>
  <section class="grid" id="grid"></section>
  <footer><span>© <span id="y"></span> Dmitrii Lutsenko</span><a href="https://t.me/dmtraw" target="_blank" rel="noopener">Telegram ↗</a></footer>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="back" id="back">← Назад</button>
  <button class="close" id="close" aria-label="Закрыть">×</button>
  <div class="shell"><div class="frame"><iframe id="player" allow="autoplay; fullscreen" title="Playable"></iframe></div></div>
  <div class="bar">
    <button id="restart">Перезапустить</button>
    <button id="rotate">Повернуть</button>
  </div>
</div>

<script>
  const grid = document.getElementById('grid');
  const lock = document.getElementById('lock');
  const modal = document.getElementById('modal');
  const player = document.getElementById('player');
  document.getElementById('y').textContent = new Date().getFullYear();

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // пароль помним только до закрытия вкладки (sessionStorage), при новом заходе спросим снова
  try { localStorage.removeItem('pf_pass'); } catch(e){}
  const store = { get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }, del(k){ try { sessionStorage.removeItem(k); } catch(e){} } };

  // ---- расшифровка (PBKDF2 + AES-GCM) ----
  let KEY = null, LIST = [];
  const blobs = {};
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pass) {
    const meta = await (await fetch('vault/meta.json', {cache:'no-cache'})).json();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(meta.salt), iterations:meta.iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  }
  async function decrypt(url) {
    const buf = new Uint8Array(await (await fetch(url, {cache:'no-cache'})).arrayBuffer());
    return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:buf.slice(0,12) }, KEY, buf.slice(12)));
  }
  async function unlock(pass) {
    KEY = await deriveKey(pass);
    LIST = JSON.parse(new TextDecoder().decode(await decrypt('vault/manifest.bin'))); // бросит ошибку при неверном пароле
    store.set('pf_pass', pass);
    lock.hidden = true;
    render();
    const h = decodeURIComponent(location.hash.slice(1));
    const hit = LIST.find(p => p.slug === h);
    if (hit) show(hit);
  }

  // ---- экран пароля ----
  const form = document.getElementById('lockform'), input = document.getElementById('pass'), err = document.getElementById('err');
  form.onsubmit = async e => {
    e.preventDefault();
    if (!input.value) return;
    form.classList.add('busy'); err.textContent = '';
    try { await unlock(input.value); }
    catch (x) { err.textContent = 'Неверный пароль'; form.classList.remove('busy'); input.select(); }
  };
  (async () => {
    // ссылка со встроенным паролем: dmtraw.github.io/#k=ПАРОЛЬ
    let pass = null;
    if (location.hash.startsWith('#k=')) {
      pass = decodeURIComponent(location.hash.slice(3));
      history.replaceState(null, '', location.pathname);
    }
    pass = pass || store.get('pf_pass');
    if (pass) {
      try { await unlock(pass); return; } catch (x) { store.del('pf_pass'); }
    }
    lock.hidden = false;
    setTimeout(() => input.focus(), 50);
  })();

  function render() {
    grid.innerHTML = '';
    LIST.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'card' + (p.land ? ' land' : '');
      b.style.animationDelay = (60 + i * 70) + 'ms';
      b.innerHTML =
        '<div class="thumb">' + (p.cover ? '<img alt="" src="' + p.cover + '">' : '<span>Play</span>') + '<i class="play"></i></div>' +
        '<div class="title">' + esc(p.title) + '</div>' +
        (p.tags ? '<div class="tags">' + esc(p.tags) + '</div>' : '');
      b.onclick = () => show(p);
      grid.appendChild(b);
    });
  }

  let pushed = false, current = null;
  async function show(p) {
    current = p;
    modal.classList.toggle('land', !!p.land);
    modal.classList.add('open', 'loading');
    fit();
    document.body.style.overflow = 'hidden';
    document.body.classList.add('viewing');
    if (location.hash !== '#' + p.slug) { history.pushState({p: p.slug}, '', '#' + p.slug); pushed = true; }
    if (!blobs[p.id]) blobs[p.id] = new TextDecoder().decode(await decrypt('vault/' + p.id + '.bin'));
    if (current === p && modal.classList.contains('open')) { player.srcdoc = blobs[p.id]; modal.classList.remove('loading'); }
  }
  function hide(fromPop) {
    if (!fromPop && location.hash) {
      if (pushed) { history.back(); return; }
      history.replaceState(null, '', location.pathname);
    }
    pushed = false; current = null;
    modal.classList.remove('open', 'loading');
    setTimeout(() => { if (!modal.classList.contains('open')) player.removeAttribute('srcdoc'); }, 350);
    document.body.style.overflow = '';
    setTimeout(() => { if (!modal.classList.contains('open')) document.body.classList.remove('viewing'); }, 200);
  }
  document.getElementById('close').onclick = () => hide();
  document.getElementById('back').onclick = () => hide();
  modal.onclick = e => { if (e.target === modal) hide(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) hide(); });
  addEventListener('popstate', () => {
    const f = decodeURIComponent(location.hash.slice(1));
    const q = LIST.find(p => p.slug === f);
    if (q) show(q); else if (modal.classList.contains('open')) hide(true);
  });
  document.getElementById('restart').onclick = () => { if (current) { player.removeAttribute('srcdoc'); setTimeout(() => player.srcdoc = blobs[current.id], 30); } };
  document.getElementById('rotate').onclick = () => { modal.classList.toggle('land'); fit(); };

  // размер рамки в целых пикселях, без дробей (иначе по краям вылезают полоски)
  const frame = document.querySelector('.frame');
  function fit() {
    const land = modal.classList.contains('land');
    const r = land ? 16 / 9 : 9 / 16;
    const maxW = Math.min(innerWidth - 32, land ? 1600 : 620);
    const maxH = innerHeight - 110;
    let w = Math.min(maxW, maxH * r);
    w = Math.floor(w / 2) * 2;
    const h = Math.round(w / r);
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  }
  addEventListener('resize', fit);

  // без контекстного меню и перетаскивания картинок
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('dragstart', e => e.preventDefault());

</script>
</body>
</html>
